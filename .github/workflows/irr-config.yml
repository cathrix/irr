name: IRR Config Generation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths: [ 'config/**', 'scripts/**', 'tests/**', '.github/workflows/irr-config.yml' ]
  pull_request:
    paths: [ 'config/**', 'scripts/**', 'tests/**', '.github/workflows/irr-config.yml' ]

permissions:
  contents: read

concurrency:
  group: irr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Install bgpq4
        run: sudo apt-get update && sudo apt-get install -y bgpq4
      - name: Generate qualified ASNs and BIRD configuration
        run: python scripts/irr.py generate
      - name: Publish irr.conf to prod branch
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          # Use the API so the prod branch never needs to be pushed to directly.
          # Always commit: the header timestamp must advance on every run, even when
          # the prefix list is unchanged.
          remote_sha=$(gh api "${api}/contents/irr.conf?ref=prod" --jq .sha 2>/dev/null || true)
          args=(-f message="chore: update irr.conf [skip ci]" -f content="$(base64 -w0 generated/irr.conf)" -f branch=prod)
          if [ -n "$remote_sha" ]; then
            args+=(-f sha="$remote_sha")
          fi
          gh api --method PUT "${api}/contents/irr.conf" "${args[@]}"
          echo "Published irr.conf to prod"
      - name: Save generated files and rejection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: irr-config
          path: generated/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: generate
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: irr-config
          path: generated/
      - name: Synchronize ARIN AS-SET
        env:
          ARIN_API_KEY: ${{ secrets.ARIN_API_KEY }}
        run: python scripts/irr.py upload
