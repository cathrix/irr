name: IRR Config Generation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths: [ 'config/**', 'scripts/**', 'tests/**', '.github/workflows/irr-config.yml' ]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Install bgpq4
        run: sudo apt-get update && sudo apt-get install -y bgpq4
      - name: Restore previous result for comparison
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p generated
          gh api "repos/${GITHUB_REPOSITORY}/contents/result.txt?ref=prod" \
            -H "Accept: application/vnd.github.raw" > generated/result.txt 2>/dev/null \
            || echo "No previous result.txt; deltas will start at +0"
      - name: Generate configuration and synchronize ARIN
        env:
          ARIN_API_KEY: ${{ secrets.ARIN_API_KEY }}
          PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/irr.py sync --publish
          else
            python scripts/irr.py sync
          fi
      - name: Publish irr.conf to prod branch
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          if ! gh api "${api}/git/ref/heads/prod" >/dev/null 2>&1; then
            gh api --method POST "${api}/git/refs" \
              -f ref="refs/heads/prod" -f sha="${GITHUB_SHA}" >/dev/null
            echo "Created branch prod from ${GITHUB_SHA}"
          fi
          # Body goes through stdin: -f content=... exceeds the per-argument limit.
          for file in irr.conf result.txt; do
            sha=$(gh api "${api}/contents/${file}?ref=prod" --jq .sha 2>/dev/null || true)
            python3 - "$file" "$sha" <<'PY' | gh api --method PUT "${api}/contents/${file}" --input -
          import base64, json, pathlib, sys
          name, sha = sys.argv[1], sys.argv[2]
          body = {
              'message': f'chore: update {name} [skip ci]',
              'content': base64.b64encode(pathlib.Path('generated', name).read_bytes()).decode(),
              'branch': 'prod',
          }
          if sha:
              body['sha'] = sha
          json.dump(body, sys.stdout)
          PY
            echo "Published ${file} to prod"
          done
      - name: Show generation report
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat generated/result.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Generation did not finish." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
